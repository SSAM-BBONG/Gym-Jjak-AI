name: Deploy FastAPI to EC2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: fastapi-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: team03/gymjjak_fastapi
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --push \
            .

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy image through AWS Systems Manager
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          FASTAPI_EC2_INSTANCE_ID: ${{ secrets.FASTAPI_EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          FASTAPI_IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          set -euo pipefail

          COMPOSE_B64="$(base64 -w 0 docker-compose.deploy.yml)"

          REMOTE_COMMAND="$(cat <<EOF
          set -euo pipefail

          APP_DIR=/opt/gymjjak-fastapi
          sudo mkdir -p "\$APP_DIR"
          test -f "\$APP_DIR/.env"

          echo '${COMPOSE_B64}' | base64 -d | sudo tee "\$APP_DIR/docker-compose.yml" > /dev/null

          aws ecr get-login-password --region '${AWS_REGION}' | sudo docker login --username AWS --password-stdin '${ECR_REGISTRY}'

          sudo FASTAPI_IMAGE='${FASTAPI_IMAGE}' docker compose -f "\$APP_DIR/docker-compose.yml" pull
          sudo FASTAPI_IMAGE='${FASTAPI_IMAGE}' docker compose -f "\$APP_DIR/docker-compose.yml" up -d --remove-orphans

          for attempt in {1..12}; do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              sudo docker image prune -f
              exit 0
            fi
            sleep 5
          done

          sudo docker compose -f "\$APP_DIR/docker-compose.yml" logs --tail=100
          exit 1
          EOF
          )"

          jq -n \
            --arg instance_id "$FASTAPI_EC2_INSTANCE_ID" \
            --arg command "$REMOTE_COMMAND" \
            '{DocumentName: "AWS-RunShellScript", InstanceIds: [$instance_id], Parameters: {commands: [$command]}}' \
            > ssm-command.json

          COMMAND_ID="$(aws ssm send-command \
            --cli-input-json file://ssm-command.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command ID: $COMMAND_ID"

          for attempt in {1..60}; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$FASTAPI_EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            echo "SSM deployment status: ${STATUS:-Pending}"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [[ "$STATUS" =~ ^(Cancelled|Failed|TimedOut)$ ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$FASTAPI_EC2_INSTANCE_ID" \
                --output json
              exit 1
            fi

            sleep 5
          done

          echo "SSM deployment timed out."
          exit 1
